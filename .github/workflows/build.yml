name: Build All

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  # ── Go binaries (server, CLI, core) ──────────────────────
  go-build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            suffix: ""
          - os: ubuntu-latest
            goos: linux
            goarch: arm64
            suffix: ""
          - os: windows-latest
            goos: windows
            goarch: amd64
            suffix: ".exe"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Build server
        run: GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build -o bitexchange-server${{ matrix.suffix }} ./cmd/bitexchange-server

      - name: Build CLI
        run: GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build -o bitexchange-cli${{ matrix.suffix }} ./cmd/bitexchange-cli

      - name: Build core
        run: GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build -o bitexchange-core${{ matrix.suffix }} ./cmd/bitexchange-core

      - name: Run tests
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: go test ./...

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: go-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            bitexchange-server${{ matrix.suffix }}
            bitexchange-cli${{ matrix.suffix }}
            bitexchange-core${{ matrix.suffix }}

  # ── Web frontend ──────────────────────────────────────────
  web-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build web
        working-directory: web
        run: |
          npm install
          npm run build

      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: web
          path: web/dist/

  # ── Desktop frontend ─────────────────────────────────────
  desktop-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build desktop frontend
        working-directory: desktop
        run: |
          npm install
          npm run build

      - name: Upload desktop artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-frontend
          path: desktop/dist/

  # ── Android APK ──────────────────────────────────────────
  android-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-debug
          path: android/app/build/outputs/apk/debug/*.apk

  # ── Release ──────────────────────────────────────────────
  release:
    needs: [go-build, web-build, desktop-build, android-build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            go-linux-amd64/*
            go-linux-arm64/*
            go-windows-amd64/*
            web/*
            desktop-frontend/*
            android-debug/*
          generate_release_notes: true
